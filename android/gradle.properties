# Keep heap modest — this machine has ~7GB RAM and fat release builds OOM/thrash.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.workers.max=1
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true
# Reduce AGP memory pressure during release packaging
android.enableR8.fullMode=false
kotlin.daemon.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=384m

